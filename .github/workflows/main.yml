name: Build M1 App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO and Tools
        run: |
          python -m pip install --upgrade pip
          pip install platformio
          sudo apt-get update && sudo apt-get install -y cmake ninja-build build-essential

      - name: Inspect Files and Run Build
        run: |
          echo "=== Workspace Contents ==="
          ls -la
          
          if [ -f "./build.sh" ]; then
            chmod +x ./build.sh
            ./build.sh
          elif [ -f "platformio.ini" ]; then
            echo "Found platformio.ini, listing environments:"
            pio project config
            pio run
          elif [ -f "CMakeLists.txt" ]; then
            cmake -B build
            cmake --build build
          elif [ -f "Makefile" ]; then
            make
          else
            echo "No recognized build file found!"
            exit 1
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m1-meshtastic-app
          path: |
            **/*.m1app
            **/*.bin
            **/*.elf

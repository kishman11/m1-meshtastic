name: Build M1 App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM Embedded Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi build-essential

      - name: Compile M1 Application
        run: |
          make clean || true
          make -j$(nproc)

      - name: Verify Generated Files
        run: |
          echo "=== Build Output Directory ==="
          ls -la
          find . -name "*.m1app" -o -name "*.bin" -o -name "*.elf"

      - name: Upload .m1app Artifact
        uses: actions/upload-artifact@v4
        with:
          name: meshtastic-m1app
          path: |
            **/*.m1app
            **/*.bin
            **/*.elf
